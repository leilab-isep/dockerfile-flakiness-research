[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakiscan"
version = "0.1.0"
description = "Static analysis and automated repair for Dockerfile build flakiness"
requires-python = ">=3.10"

[project.scripts]
flakiscan = "flakiscan.cli:main"

[tool.setuptools.packages.find]
include = ["flakiscan*"]
exclude = ["flakiscan.tests*"]

[tool.setuptools.package-data]
flakiscan = ["detection/parfum_runner.js"]

[tool.black]
line-length = 150
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  venv
  | \.venv
)/
'''

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
