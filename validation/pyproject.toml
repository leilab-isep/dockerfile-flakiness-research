[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakiscan-validate"
version = "0.1.0"
description = "Build-based validation that a modified Dockerfile still builds, compared to its original"
requires-python = ">=3.10"

[project.scripts]
flakiscan-validate = "flakiscan_validate.cli:main"

[tool.setuptools.packages.find]
include = ["flakiscan_validate*"]

[tool.black]
line-length = 150
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
