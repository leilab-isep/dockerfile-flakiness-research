name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  HADOLINT_VERSION: "2.14.0"
  # sha256 of the hadolint-linux-x86_64 asset for the pinned HADOLINT_VERSION above,
  # from that release's published hadolint-linux-x86_64.sha256 -- verified before the
  # downloaded binary is trusted, rather than trusting the download itself.
  HADOLINT_SHA256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check flakiscan

      - name: black --check
        run: black --check --diff flakiscan

  build:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build backend
        run: pip install -r requirements-dev.txt

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke test the built wheel in a clean environment
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/flakiscan flakiscan/tests/fixtures/healthy.Dockerfile

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flakiscan-dist
          path: dist/

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install coverage
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: >
          coverage run --source=flakiscan --omit="flakiscan/tests/*"
          -m unittest discover -s flakiscan/tests/unit -p "test_*.py" -v

      - name: Coverage report (fails below 80%)
        run: coverage report -m --fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: .coverage

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Hadolint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  $HOME/.local/bin/hadolint" | sha256sum -c -
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Docker Parfum
        run: npm install -g @tdurieux/docker-parfum@1.0.0

      - name: Verify tools are on PATH
        run: |
          hadolint --version
          docker-parfum --help > /dev/null

      - name: Run integration tests
        run: python -m unittest discover -s flakiscan/tests/integration -p "test_*.py" -v

  e2e:
    name: End-to-end tests
    needs: [lint, build, test, integration]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flakiscan-dist
          path: dist/

      - name: Install the built wheel
        run: |
          python -m venv /tmp/flakiscan-venv
          /tmp/flakiscan-venv/bin/pip install dist/*.whl
          echo "/tmp/flakiscan-venv/bin" >> "$GITHUB_PATH"

      - name: Install Hadolint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  $HOME/.local/bin/hadolint" | sha256sum -c -
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Docker Parfum
        run: npm install -g @tdurieux/docker-parfum@1.0.0

      - name: Verify tools are on PATH
        run: |
          flakiscan --help > /dev/null
          hadolint --version
          docker-parfum --help > /dev/null

      - name: Run e2e rule coverage tests
        run: python -m unittest discover -s flakiscan/tests/e2e -p "test_*.py" -v
